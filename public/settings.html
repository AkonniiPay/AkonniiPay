<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Account Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" id="sidebar-wrapper" style="min-width: 240px; min-height: 100vh;">
      <h3 class="fw-bold fs-4 mb-4 text-primary">AkonniiPay</h3>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2"><a href="/dashboard" class="nav-link text-white-50"><i class="bi bi-house-door me-2"></i> Home</a></li>
        <li class="nav-item mb-2"><a href="/generate-link.html" class="nav-link text-white-50"><i class="bi bi-link-45deg me-2"></i> Generate Link</a></li>
        <li class="nav-item mb-2"><a href="/transactions.html" class="nav-link text-white-50"><i class="bi bi-list-task me-2"></i> Transactions</a></li>
        <li class="nav-item mb-2"><a href="/verification.html" class="nav-link text-white-50"><i class="bi bi-shield-check me-2"></i> Verification Center</a></li>
        <li class="nav-item mb-2"><a href="/settings.html" class="nav-link active text-white"><i class="bi bi-gear me-2"></i> Settings</a></li>
      </ul>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Account Settings</h2>
        <button id="editDetailsBtn" class="btn btn-primary"><i class="bi bi-pencil me-1"></i> Edit Details</button>
      </div>

      <div class="card border-0 shadow-sm p-4 rounded-3" style="max-width: 700px;">
        <div class="mb-3 p-3 bg-light rounded border">
          <label class="text-muted small fw-semibold">Full Legal Name</label>
          <div class="fw-bold fs-5" id="settingsName">Luqman Abiodun Oyewole</div>
        </div>

        <div class="mb-3 p-3 bg-light rounded border">
          <label class="text-muted small fw-semibold">Residential Address</label>
          <div class="fw-semibold" id="settingsAddress">Not provided yet</div>
        </div>

        <div class="mb-3 p-3 bg-light rounded border">
          <label class="text-muted small fw-semibold">Phone Number</label>
          <div class="fw-semibold" id="settingsPhone">+234 808 056 7034</div>
        </div>

        <div class="mb-3 p-3 bg-light rounded border">
          <label class="text-muted small fw-semibold">Occupation / Business Type</label>
          <div class="fw-semibold" id="settingsOccupation">Software Developer</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Details Modal -->
  <div class="modal fade" id="editSettingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title fw-bold">Edit Account Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div id="modalAlert" class="alert d-none py-2 px-3 small"></div>
          <form id="editSettingsForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Full Legal Name</label>
              <input type="text" id="inputFullName" class="form-control" placeholder="Luqman Abiodun Oyewole" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Residential Address</label>
              <input type="text" id="inputAddress" class="form-control" placeholder="123 Main St, Lagos">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="text" id="inputPhone" class="form-control" placeholder="+234 808 056 7034">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Occupation / Business Type</label>
              <input type="text" id="inputOccupation" class="form-control" placeholder="Software Developer">
            </div>
            <button type="submit" id="saveChangesBtn" class="btn btn-primary w-100 py-2 fw-semibold">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const editBtn = document.getElementById('editDetailsBtn');
      const modal = new bootstrap.Modal(document.getElementById('editSettingsModal'));
      const editForm = document.getElementById('editSettingsForm');
      const modalAlert = document.getElementById('modalAlert');

      // Fetch Profile Details
      try {
        const res = await fetch('/api/user/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const user = data.user || data;

        if (user) {
          const currentName = user.fullName || user.name || `${user.firstName || ''} ${user.lastName || ''}`.trim() || "Luqman Abiodun Oyewole";
          document.getElementById('settingsName').innerText = currentName;
          document.getElementById('settingsAddress').innerText = user.address || "Not provided yet";
          document.getElementById('settingsPhone').innerText = user.phoneNumber || user.phone || "+234 808 056 7034";
          document.getElementById('settingsOccupation').innerText = user.occupation || "Software Developer";

          document.getElementById('inputFullName').value = currentName;
          document.getElementById('inputAddress').value = user.address || '';
          document.getElementById('inputPhone').value = user.phoneNumber || user.phone || '';
          document.getElementById('inputOccupation').value = user.occupation || '';
        }
      } catch (err) {
        console.error('Settings fetch error:', err);
      }

      editBtn.addEventListener('click', () => {
        modal.show();
      });

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveChangesBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        const fullName = document.getElementById('inputFullName').value.trim();
        const address = document.getElementById('inputAddress').value.trim();
        const phoneNumber = document.getElementById('inputPhone').value.trim();
        const occupation = document.getElementById('inputOccupation').value.trim();

        try {
          const res = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ fullName, address, phoneNumber, phone: phoneNumber, occupation })
          });

          const data = await res.json();
          if (res.ok && data.success !== false) {
            modalAlert.className = 'alert alert-success py-2 px-3 small';
            modalAlert.innerText = 'Settings updated successfully!';
            modalAlert.classList.remove('d-none');
            setTimeout(() => { window.location.reload(); }, 1000);
          } else {
            saveBtn.disabled = false;
            saveBtn.innerText = 'Save Changes';
            modalAlert.className = 'alert alert-danger py-2 px-3 small';
            modalAlert.innerText = data.message || data.error || 'Error updating profile.';
            modalAlert.classList.remove('d-none');
          }
        } catch (err) {
          saveBtn.disabled = false;
          saveBtn.innerText = 'Save Changes';
          modalAlert.className = 'alert alert-danger py-2 px-3 small';
          modalAlert.innerText = 'Server communication error.';
          modalAlert.classList.remove('d-none');
        }
      });
    });
  </script>
</body>
</html>
