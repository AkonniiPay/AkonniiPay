<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkonniiPay - Account Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: #1a1f36; color: #fff; padding-top: 20px; }
        .sidebar a { color: #a3aed0; text-decoration: none; padding: 12px 20px; display: block; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #2b3149; border-left: 4px solid #4318ff; }
        .main-content { padding: 30px; }
        .info-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px 16px; margin-bottom: 15px; position: relative; }
        .edit-btn { position: absolute; right: 15px; top: 12px; cursor: pointer; color: #4318ff; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="text-center mb-4 text-white">AkonniiPay</h4>
            <a href="/dashboard"><i class="fa-solid fa-house me-2"></i> 🏠 Home</a>
            <a href="/generate-link"><i class="fa-solid fa-link me-2"></i> 🔗 Generate Link</a>
            <a href="/transactions"><i class="fa-solid fa-list-check me-2"></i> 📊 Transactions</a>
            <a href="/verification"><i class="fa-solid fa-shield-halved me-2"></i> 🛡️ Verification Center</a>
            <a href="/settings" class="active"><i class="fa-solid fa-gear me-2"></i> ⚙️ Settings</a>
        </div>

        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Account Settings</h2>
                <button id="toggleEditBtn" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-pen ms-1"></i> Edit Details</button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- VIEW MODE -->
                    <div id="viewMode">
                        <div class="info-box">
                            <small class="text-muted d-block">Full Legal Name</small>
                            <strong id="displayFullName" class="fs-5">Luqman Abiodun Oyewole</strong>
                        </div>
                        <div class="info-box">
                            <small class="text-muted d-block">Residential Address</small>
                            <span id="displayAddress" class="fw-semibold">Not provided yet</span>
                        </div>
                        <div class="info-box">
                            <small class="text-muted d-block">Occupation / Business</small>
                            <span id="displayOccupation" class="fw-semibold">Not provided yet</span>
                        </div>
                    </div>

                    <!-- EDIT FORM -->
                    <form id="settingsForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Legal Name</label>
                            <input type="text" id="settingsName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Residential Address</label>
                            <textarea id="settingsAddress" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Occupation / Job Title</label>
                            <input type="text" id="settingsOccupation" class="form-control" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                            <button type="button" id="cancelEditBtn" class="btn btn-light px-4">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
