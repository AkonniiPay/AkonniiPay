<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-part {
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100">

  <div class="card bg-secondary text-white p-4 shadow-lg border-0 rounded-4" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-3">
      <div class="auth-logo">
        <svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-part">
            <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
            <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
            <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
            <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
            <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
            <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
            <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
          </g>
        </svg>
      </div>
      <h3 class="fw-bold text-primary mb-0">AkonniiPay</h3>
    </div>
    
    <h5 class="text-center mb-4">Create Your Merchant Account</h5>

    <div id="alertBox" class="alert d-none py-2 px-3 mb-3 small"></div>

    <form id="signupForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase">Full Legal Name</label>
        <input type="text" id="nameInput" class="form-control" placeholder="Luqman Abiodun Oyewole" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase">Email Address</label>
        <input type="email" id="emailInput" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase">Password</label>
        <input type="password" id="passwordInput" class="form-control" placeholder="••••••••••••" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase">Residential Address</label>
        <input type="text" id="addressInput" class="form-control" placeholder="Enter your full address" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold py-2">Create Account</button>
    </form>

    <div class="text-center mt-3 small">
      Already have an account? <a href="/login.html" class="text-primary text-decoration-none fw-semibold">Sign In</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const address = document.getElementById('addressInput').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, address })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('token', data.token);
          alertBox.className = 'alert alert-success py-2 px-3 mb-3 small';
          alertBox.innerText = 'Account created successfully! Redirecting...';
          alertBox.classList.remove('d-none');
          setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Create Account';
          alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
          alertBox.innerText = data.message || 'Registration failed.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Create Account';
        alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
        alertBox.innerText = 'Communication error with server.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
