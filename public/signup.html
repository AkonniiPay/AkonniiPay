<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Register Merchant Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-black text-blue-500 tracking-wider">AkonniiPay</h1>
      <p class="text-xs text-gray-400">Create your multi-currency fintech account</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Full Name (as per ID)</label>
        <input type="text" id="name" placeholder="Luqman Abiodun Oyewole" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
        <input type="password" id="password" placeholder="••••••••" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Residential Address</label>
        <input type="text" id="address" placeholder="Enter your full street address & city" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl shadow-lg transition">Create Account</button>
    </form>

    <div class="text-center text-xs text-gray-400">
      Already have an account? <a href="/login.html" class="text-blue-400 font-semibold hover:underline">Sign In</a>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const address = document.getElementById('address').value;

      try {
        const res = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, address })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Registration failed');

        localStorage.setItem('token', data.token);
        alert(data.message);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
