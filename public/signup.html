<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AkonniiPay - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --ak-bg-light: #f8fafc;
      --ak-card-bg: #ffffff;
      --ak-primary: #2563eb;
      --ak-dark: #0f172a;
      --ak-text-muted: #64748b;
      --ak-border: #e2e8f0;
      --ak-purple-btn: #4c1d95;
    }

    body {
      background-color: var(--ak-bg-light);
      color: var(--ak-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body.akonnii-loading {
      overflow: hidden !important;
    }

    /* 5-Second Global SVG Splash Screen Overlay */
    #akonnii-global-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .akonnii-loader-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .akonnii-progress-track {
      width: 140px;
      height: 3px;
      background-color: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .akonnii-progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #1e40af, #3b82f6, #1e40af);
      position: absolute;
      animation: akonniiSlide 1.2s infinite ease-in-out;
      transform-origin: left;
    }

    @keyframes akonniiSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #akonnii-global-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Animated SVG Logo Parts */
    .logo-part {
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: 1.2s;
      animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      animation-fill-mode: forwards;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .leaf-back { animation-name: popScale; animation-delay: 0.2s; }
    .leaf-front { animation-name: popScale; animation-delay: 0.35s; }
    .blue-body { animation-name: slideRight; animation-delay: 0.1s; }
    .card-element { animation-name: slideUp; animation-delay: 0.5s; }

    @keyframes slideRight {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(30px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes popScale {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--ak-border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      max-width: 480px;
      width: 100%;
      padding: 40px;
    }

    .btn-pill-solid {
      background-color: var(--ak-purple-btn);
      color: #ffffff;
      border-radius: 50px;
      padding: 11px 24px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      border: none;
      transition: background 0.2s;
    }
    .btn-pill-solid:hover {
      background-color: #3b0764;
      color: #ffffff;
    }

    @media (max-width: 576px) {
      .auth-card { padding: 24px; border: none; box-shadow: none; background: transparent; }
    }
  </style>
</head>
<body class="akonnii-loading d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <!-- AkonniiPay Global Brand Loader -->
  <div id="akonnii-global-loader">
    <div class="akonnii-loader-body">
      <div style="width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-part leaf-back">
            <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
          </g>
          <g class="logo-part leaf-front">
            <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
          </g>
          <g class="logo-part blue-body">
            <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
          </g>
          <g class="logo-part card-element">
            <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
            <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
            <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
            <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
          </g>
        </svg>
      </div>
      <div class="akonnii-progress-track">
        <div class="akonnii-progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
        <svg viewBox="0 0 400 400" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
          <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
          <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
          <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
          <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
          <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
          <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
          <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
        </svg>
        <span class="fs-4 fw-bold text-dark">AkonniiPay</span>
      </a>
      <h4 class="fw-bold text-dark mb-1">Create Your Merchant Account</h4>
      <p class="text-muted small">Fill in your details to start accepting direct client payments</p>
    </div>

    <div id="alertBox" class="alert d-none py-2 px-3 mb-3 small"></div>

    <form id="signupForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">FULL LEGAL NAME</label>
        <input type="text" id="nameInput" class="form-control py-2" placeholder="Luqman Abiodun Oyewole" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">EMAIL ADDRESS</label>
        <input type="email" id="emailInput" class="form-control py-2" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">PASSWORD</label>
        <input type="password" id="passwordInput" class="form-control py-2" placeholder="••••••••••••" required>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-muted">RESIDENTIAL ADDRESS</label>
        <input type="text" id="addressInput" class="form-control py-2" placeholder="Enter your full address" required>
      </div>

      <button type="submit" id="submitBtn" class="btn-pill-solid w-100 py-2.5">Create Account</button>
    </form>

    <div class="text-center mt-4 small">
      Already have an account? <a href="/login.html" class="text-primary text-decoration-none fw-semibold">Sign In</a>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const loader = document.getElementById('akonnii-global-loader');
      setTimeout(function() {
        if (loader) {
          loader.classList.add('hidden');
          document.body.classList.remove('akonnii-loading');
        }
      }, 5000);
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const address = document.getElementById('addressInput').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, address })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('token', data.token);
          alertBox.className = 'alert alert-success py-2 px-3 mb-3 small';
          alertBox.innerText = 'Account created successfully! Redirecting...';
          alertBox.classList.remove('d-none');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Create Account';
          alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
          alertBox.innerText = data.message || 'Registration failed.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Create Account';
        alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
        alertBox.innerText = 'Communication error with server.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
