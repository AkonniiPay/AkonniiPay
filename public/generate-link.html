<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Generate Payment Link</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="d-flex" id="wrapper">
    <div class="bg-dark text-white p-3" id="sidebar-wrapper" style="min-width: 240px; min-height: 100vh;">
      <h3 class="fw-bold fs-4 mb-4 text-primary">AkonniiPay</h3>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2"><a href="/dashboard" class="nav-link text-white-50"><i class="bi bi-house-door me-2"></i> Home</a></li>
        <li class="nav-item mb-2"><a href="/generate-link.html" class="nav-link active text-white"><i class="bi bi-link-45deg me-2"></i> Generate Link</a></li>
        <li class="nav-item mb-2"><a href="/transactions.html" class="nav-link text-white-50"><i class="bi bi-list-task me-2"></i> Transactions</a></li>
        <li class="nav-item mb-2"><a href="/verification.html" class="nav-link text-white-50"><i class="bi bi-shield-check me-2"></i> Verification Center</a></li>
        <li class="nav-item mb-2"><a href="/settings.html" class="nav-link text-white-50"><i class="bi bi-gear me-2"></i> Settings</a></li>
      </ul>
    </div>

    <div id="page-content-wrapper" class="w-100 p-4">
      <h2 class="fw-bold mb-4">Generate Payment Link</h2>

      <div class="card border-0 shadow-sm p-4 rounded-3" style="max-width: 650px;">
        <div id="alertBox" class="alert d-none py-2 px-3 mb-3 small"></div>

        <form id="linkForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Payment Title / Purpose</label>
            <input type="text" id="title" class="form-control" placeholder="e.g. Video Editing Services" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold" id="amountLabel">Amount (Min: ₦200)</label>
              <input type="number" id="amount" class="form-control" placeholder="200" min="200" required>
              <div id="amountWarning" class="text-danger small mt-1 d-none">Minimum amount is ₦200</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Currency</label>
              <select id="currency" class="form-select">
                <option value="NGN">NGN (Naira - Paystack/Flutterwave)</option>
                <option value="USD">USD (Dollar Checkout)</option>
                <option value="GBP">GBP (Pound Checkout)</option>
                <option value="EUR">EUR (Euro Checkout)</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Platform Fee Bearer</label>
              <select id="feeBearer" class="form-select">
                <option value="payer">Payer pays fee (Add charges to client total)</option>
                <option value="merchant">Merchant pays fee (Deduct charges from balance)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Link Expiry Date (Optional)</label>
              <input type="date" id="expiryDate" class="form-control">
            </div>
          </div>

          <button type="submit" id="generateBtn" class="btn btn-primary fw-semibold px-4 py-2">
            Generate Link
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const amountInput = document.getElementById('amount');
      const currencySelect = document.getElementById('currency');
      const amountLabel = document.getElementById('amountLabel');
      const amountWarning = document.getElementById('amountWarning');
      const generateBtn = document.getElementById('generateBtn');
      const linkForm = document.getElementById('linkForm');
      const alertBox = document.getElementById('alertBox');
      const token = localStorage.getItem('token');

      function validateAmount() {
        const val = parseFloat(amountInput.value);
        const curr = currencySelect.value;
        const minVal = curr === 'NGN' ? 200 : 1;

        if (curr === 'NGN') {
          amountLabel.innerText = "Amount (Min: ₦200)";
          amountInput.min = "200";
        } else {
          amountLabel.innerText = `Amount (Min: $1 ${curr})`;
          amountInput.min = "1";
        }

        if (isNaN(val) || val < minVal) {
          amountWarning.innerText = curr === 'NGN' ? "Minimum amount is ₦200" : `Minimum amount is $1 ${curr}`;
          amountWarning.classList.remove('d-none');
          generateBtn.disabled = true;
        } else {
          amountWarning.classList.add('d-none');
          generateBtn.disabled = false;
        }
      }

      amountInput.addEventListener('input', validateAmount);
      currencySelect.addEventListener('change', validateAmount);

      linkForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const amount = document.getElementById('amount').value;
        const currency = currencySelect.value;
        const feeBearer = document.getElementById('feeBearer').value;
        const expiryDate = document.getElementById('expiryDate').value;

        generateBtn.disabled = true;
        generateBtn.innerText = 'Creating Link...';

        try {
          const res = await fetch('/api/payment/create-link', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ title, amount, currency, feeBearer, expiryDate })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            alertBox.className = 'alert alert-success py-2 px-3 mb-3 small';
            alertBox.innerText = 'Payment link created successfully! Redirecting to dashboard...';
            alertBox.classList.remove('d-none');
            setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
          } else {
            generateBtn.disabled = false;
            generateBtn.innerText = 'Generate Link';
            alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
            alertBox.innerText = data.message || 'Error generating link.';
            alertBox.classList.remove('d-none');
          }
        } catch (err) {
          generateBtn.disabled = false;
          generateBtn.innerText = 'Generate Link';
          alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
          alertBox.innerText = 'Server error creating link.';
          alertBox.classList.remove('d-none');
        }
      });
    });
  </script>
</body>
</html>
