<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Verification Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" id="sidebar-wrapper" style="min-width: 240px; min-height: 100vh;">
      <h3 class="fw-bold fs-4 mb-4 text-primary">AkonniiPay</h3>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2"><a href="/dashboard" class="nav-link text-white-50"><i class="bi bi-house-door me-2"></i> Home</a></li>
        <li class="nav-item mb-2"><a href="/generate-link.html" class="nav-link text-white-50"><i class="bi bi-link-45deg me-2"></i> Generate Link</a></li>
        <li class="nav-item mb-2"><a href="/transactions.html" class="nav-link text-white-50"><i class="bi bi-list-task me-2"></i> Transactions</a></li>
        <li class="nav-item mb-2"><a href="/verification.html" class="nav-link active text-white"><i class="bi bi-shield-check me-2"></i> Verification Center</a></li>
        <li class="nav-item mb-2"><a href="/settings.html" class="nav-link text-white-50"><i class="bi bi-gear me-2"></i> Settings</a></li>
      </ul>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Identity Verification (KYC)</h2>
        <span id="verificationBadge" class="badge bg-warning text-dark fs-6 px-3 py-2">Pending Verification</span>
      </div>

      <div class="card border-0 shadow-sm p-4 rounded-3" style="max-width: 600px;">
        <div id="statusAlert" class="alert d-none py-2 px-3 mb-3 small"></div>

        <form id="kycForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">11-Digit BVN (Bank Verification Number)</label>
            <input type="text" id="bvnInput" class="form-control" maxlength="11" placeholder="Enter exactly 11-digit BVN" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">11-Digit NIN (National Identity Number)</label>
            <input type="text" id="ninInput" class="form-control" maxlength="11" placeholder="Enter exactly 11-digit NIN" required>
          </div>

          <button type="submit" id="verifyBtn" class="btn btn-primary fw-semibold w-100 py-2">
            Verify Account Instantly
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const form = document.getElementById('kycForm');
      const alertBox = document.getElementById('statusAlert');
      const verifyBtn = document.getElementById('verifyBtn');
      const bvnInput = document.getElementById('bvnInput');
      const ninInput = document.getElementById('ninInput');
      const badge = document.getElementById('verificationBadge');

      // Load user saved details and KYC status on page load
      try {
        const profileRes = await fetch('/api/user/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const profileData = await profileRes.json();

        if (profileData.user) {
          if (profileData.user.bvn) bvnInput.value = profileData.user.bvn;
          if (profileData.user.nin) ninInput.value = profileData.user.nin;

          if (profileData.user.kycStatus === 'Verified') {
            badge.className = 'badge bg-success text-white fs-6 px-3 py-2';
            badge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Already Verified';

            alertBox.className = 'alert alert-success py-3 px-3 mb-3';
            alertBox.innerHTML = '<strong>Identity Verified!</strong> Your BVN and NIN are linked and your dedicated virtual accounts are active.';
            alertBox.classList.remove('d-none');

            bvnInput.disabled = true;
            ninInput.disabled = true;
            verifyBtn.disabled = true;
            verifyBtn.className = 'btn btn-success fw-semibold w-100 py-2';
            verifyBtn.innerText = 'Verified & Secured';
          }
        }
      } catch (err) {
        console.error('KYC Profile fetch error:', err);
      }

      // Handle Verification Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const bvn = bvnInput.value.trim();
        const nin = ninInput.value.trim();

        if (bvn.length !== 11 || nin.length !== 11) {
          alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
          alertBox.innerText = 'Both BVN and NIN must be exactly 11 digits.';
          alertBox.classList.remove('d-none');
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerText = 'Verifying with Banking Registry...';

        try {
          const res = await fetch('/api/kyc/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ bvn, nin })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            alertBox.className = 'alert alert-success py-2 px-3 mb-3 small';
            alertBox.innerText = 'Verification successful! Your BVN and NIN have been saved.';
            alertBox.classList.remove('d-none');

            badge.className = 'badge bg-success text-white fs-6 px-3 py-2';
            badge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Already Verified';

            bvnInput.disabled = true;
            ninInput.disabled = true;
            verifyBtn.className = 'btn btn-success fw-semibold w-100 py-2';
            verifyBtn.innerText = 'Verified & Secured';

            setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
          } else {
            verifyBtn.disabled = false;
            verifyBtn.innerText = 'Verify Account Instantly';
            alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
            alertBox.innerText = data.message || 'Incorrect BVN/NIN details provided. Verification failed.';
            alertBox.classList.remove('d-none');
          }
        } catch (err) {
          verifyBtn.disabled = false;
          verifyBtn.innerText = 'Verify Account Instantly';
          alertBox.className = 'alert alert-danger py-2 px-3 mb-3 small';
          alertBox.innerText = 'Server error during verification. Please try again.';
          alertBox.classList.remove('d-none');
        }
      });
    });
  </script>
</body>
</html>
