<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkonniiPay - Verification Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: #1a1f36; color: #fff; padding-top: 20px; }
        .sidebar a { color: #a3aed0; text-decoration: none; padding: 12px 20px; display: block; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #2b3149; border-left: 4px solid #4318ff; }
        .main-content { padding: 30px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="text-center mb-4 text-white">AkonniiPay</h4>
            <a href="/dashboard"><i class="fa-solid fa-house me-2"></i> 🏠 Home</a>
            <a href="/generate-link"><i class="fa-solid fa-link me-2"></i> 🔗 Generate Link</a>
            <a href="/transactions"><i class="fa-solid fa-list-check me-2"></i> 📊 Transactions</a>
            <a href="/verification" class="active"><i class="fa-solid fa-shield-halved me-2"></i> 🛡️ Verification Center</a>
            <a href="/settings"><i class="fa-solid fa-gear me-2"></i> ⚙️ Settings</a>
        </div>

        <div class="col-md-10 main-content">
            <h2 class="mb-4">Verification Center (KYC)</h2>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="card-title fw-bold">KYC Status: <span id="kycStatusBadge" class="badge bg-warning">Pending</span></h5>
                    <p class="text-muted small">Legal requirement: Full name must match registered details: <strong>Luqman Abiodun Oyewole</strong>.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form id="kycForm">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Bank Verification Number (BVN)</label>
                            <input type="text" id="bvnInput" class="form-control" maxlength="11" placeholder="11-digit BVN" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">National Identity Number (NIN)</label>
                            <input type="text" id="ninInput" class="form-control" maxlength="11" placeholder="11-digit NIN" required>
                        </div>
                        <button type="submit" class="btn btn-primary py-2 px-4">Submit Verification Data</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
