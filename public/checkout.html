<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Secure Global Guest Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Paystack SDK for NGN -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <!-- Flutterwave SDK for USD, EUR, GBP -->
  <script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-lg bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-blue-500 tracking-wider">AkonniiPay</h1>
      <p id="recipientLabel" class="text-xs text-gray-400">Secure Global Payment Gateway</p>
    </div>

    <div class="bg-gray-800/80 border border-gray-700/60 p-6 rounded-2xl space-y-2">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Payment Request</p>
      <h2 id="checkoutTitle" class="text-xl font-bold text-white">Loading payment details...</h2>
      <p id="checkoutDescription" class="text-xs text-gray-300"></p>
      <div class="pt-2 flex justify-between items-center border-t border-gray-700 mt-4">
        <span class="text-xs text-gray-400">Total Amount</span>
        <span id="checkoutAmount" class="text-3xl font-extrabold text-green-400">$0.00</span>
      </div>
    </div>

    <form id="checkoutForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Full Name</label>
        <input type="text" id="guestName" placeholder="Enter your full name" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Email Address</label>
        <input type="email" id="guestEmail" placeholder="Enter your email address" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" id="payBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
        Pay Now
      </button>
    </form>

    <div class="text-center">
      <span class="text-xs text-gray-500">🔒 Encrypted & Secured by AkonniiPay</span>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const linkIdentifier = urlParams.get('id') || urlParams.get('slug');

    let linkData = null;

    async function loadCheckoutDetails() {
      if (!linkIdentifier) {
        document.body.innerHTML = `<div class="text-center p-8 text-red-400 font-bold">Invalid payment link.</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/payment/checkout/${linkIdentifier}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        linkData = data;
        document.getElementById('checkoutTitle').innerText = data.title;
        document.getElementById('checkoutDescription').innerText = data.description || '';
        
        const currency = (data.currency || 'USD').toUpperCase();
        const symbol = currency === 'NGN' ? '₦' : currency === 'EUR' ? '€' : currency === 'GBP' ? '£' : '$';
        document.getElementById('checkoutAmount').innerText = `${symbol}${Number(data.amount).toFixed(2)} (${currency})`;
        document.getElementById('recipientLabel').innerText = `Paid to ${data.recipientName || 'Merchant'}`;
      } catch (err) {
        document.body.innerHTML = `<div class="text-center p-8 text-red-400 font-bold">Payment link expired or not found.</div>`;
      }
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const guestName = document.getElementById('guestName').value;
      const guestEmail = document.getElementById('guestEmail').value;

      if (!linkData) return alert('Payment data not loaded.');

      const currency = (linkData.currency || 'USD').toUpperCase();
      const amount = Number(linkData.amount);
      const reference = 'AKP_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

      if (currency === 'NGN') {
        // Route NGN through Paystack
        const paystackKey = 'pk_test_f072c4b9ce7cdc851f1c6cad46e84620e66a7252';
        const handler = PaystackPop.setup({
          key: paystackKey,
          email: guestEmail,
          amount: Math.round(amount * 100),
          currency: 'NGN',
          ref: reference,
          metadata: { guestName, linkId: linkData.id, merchantId: linkData.merchantId },
          callback: function(response) {
            verifyPaymentOnBackend(response.reference, guestName, guestEmail);
          },
          onClose: function() { alert('Payment closed.'); }
        });
        handler.openIframe();
      } else {
        // Route USD, EUR, GBP through Flutterwave International
        FlutterwaveCheckout({
          public_key: 'FLWPUBK_TEST-xxxxxxxxxxxxxxxxxxxxx-X', // Replace with your Flutterwave Test Public Key when ready
          tx_ref: reference,
          amount: amount,
          currency: currency,
          payment_options: "card,banktransfer,paypal",
          customer: {
            email: guestEmail,
            name: guestName,
          },
          callback: function (data) {
            verifyPaymentOnBackend(data.transaction_id, guestName, guestEmail);
          },
          onclose: function() { alert('Payment window closed.'); },
          customizations: {
            title: "AkonniiPay Global Checkout",
            description: linkData.title,
            logo: "https://assets.piedpiper.com/logo.png",
          },
        });
      }
    });

    async function verifyPaymentOnBackend(reference, guestName, guestEmail) {
      try {
        const res = await fetch(`${API_URL}/api/payment/checkout/${linkIdentifier}/pay`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference, guestName, guestEmail, paymentMethod: 'gateway' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        alert(data.message);
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    loadCheckoutDetails();
  </script>
</body>
</html>
