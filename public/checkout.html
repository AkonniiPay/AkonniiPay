<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AkonniiPay Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
  <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-700">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-400">AkonniiPay</h1>
      <p class="text-gray-400 text-sm mt-1" id="recipient-info">Loading payment details...</p>
    </div>

    <div class="bg-gray-900 p-4 rounded-xl mb-6 border border-gray-700">
      <h2 id="link-title" class="font-semibold text-lg text-gray-200">Payment Request</h2>
      <p id="link-desc" class="text-gray-400 text-sm mb-3"></p>
      <div class="text-3xl font-bold text-white" id="amount-display">$0.00</div>
    </div>

    <form id="checkout-form" class="space-y-4">
      <div id="custom-amount-group" class="hidden">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Custom Amount</label>
        <input type="number" id="customAmount" placeholder="Enter amount" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Name</label>
        <input type="text" id="guestName" placeholder="Michael Scott" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Email</label>
        <input type="email" id="guestEmail" placeholder="michael@dundermifflin.com" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Payment Method</label>
        <select id="paymentMethod" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
          <option value="card">Credit / Debit Card</option>
          <option value="paypal">PayPal</option>
          <option value="wise">Wise Transfer</option>
          <option value="bank_wire">Bank Wire</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg transition duration-200 shadow-lg mt-2">
        Complete Payment
      </button>
    </form>

    <div id="status-message" class="mt-4 text-center text-sm"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    async function loadLinkData() {
      if (!slug) return;
      try {
        const res = await fetch(`/api/payment/checkout/${slug}`);
        const data = await res.json();
        
        document.getElementById('link-title').innerText = data.title;
        document.getElementById('link-desc').innerText = data.description || '';
        document.getElementById('recipient-info').innerText = `Pay to ${data.recipientName}`;
        
        if (data.amount > 0) {
          document.getElementById('amount-display').innerText = `${data.currency} ${data.amount.toFixed(2)}`;
        } else {
          document.getElementById('amount-display').innerText = 'Open Custom Amount';
          document.getElementById('custom-amount-group').classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status-message');
      status.innerText = 'Processing payment...';
      status.className = 'mt-4 text-center text-sm text-yellow-400';

      const bodyData = {
        paymentMethod: document.getElementById('paymentMethod').value,
        guestName: document.getElementById('guestName').value,
        guestEmail: document.getElementById('guestEmail').value,
        customAmount: document.getElementById('customAmount').value || undefined
      };

      try {
        const res = await fetch(`/api/payment/checkout/${slug}/pay`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();

        if (res.ok) {
          status.innerText = `✅ ${data.message}`;
          status.className = 'mt-4 text-center text-sm text-emerald-400 font-semibold';
        } else {
          status.innerText = `❌ ${data.message || 'Payment failed.'}`;
          status.className = 'mt-4 text-center text-sm text-red-400';
        }
      } catch (err) {
        status.innerText = '❌ Network error processing payment.';
        status.className = 'mt-4 text-center text-sm text-red-400';
      }
    });

    loadLinkData();
  </script>
</body>
</html>
