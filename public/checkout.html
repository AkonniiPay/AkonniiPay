<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Secure Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card border-0 shadow-lg p-4 rounded-4 w-100" style="max-width: 480px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">AkonniiPay</h3>
      <p class="text-muted small">Secure Client Checkout</p>
    </div>

    <div id="loadingState" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted small mt-2">Loading payment details...</p>
    </div>

    <div id="errorState" class="alert alert-danger d-none text-center py-3"></div>

    <div id="checkoutContent" class="d-none">
      <div class="bg-light p-3 rounded-3 mb-3 border">
        <span class="text-muted small fw-semibold d-block mb-1">Payment For</span>
        <h5 class="fw-bold text-dark mb-3" id="paymentTitle">Loading...</h5>
        <div class="d-flex justify-content-between align-items-center border-top pt-2">
          <span class="text-muted small">Amount Due</span>
          <h4 class="fw-bold text-success mb-0" id="paymentAmount">₦0</h4>
        </div>
      </div>

      <form id="checkoutForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Your Full Name</label>
          <input type="text" id="clientName" class="form-control" placeholder="Enter your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Your Email Address</label>
          <input type="email" id="clientEmail" class="form-control" placeholder="Enter your email" required>
        </div>

        <button type="submit" id="payBtn" class="btn btn-primary w-100 fw-semibold py-2">
          Pay Now
        </button>
      </form>
    </div>

    <div class="text-center mt-4">
      <small class="text-muted"><i class="bi bi-shield-lock-fill text-success me-1"></i> Secured by AkonniiPay Direct Gateway</small>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Extract slug from URL path (/pay/:slug) or fallback to query id (?id=...)
      const pathParts = window.location.pathname.split('/');
      const slug = pathParts.includes('pay') ? pathParts[pathParts.indexOf('pay') + 1] : null;
      const urlParams = new URLSearchParams(window.location.search);
      const linkId = urlParams.get('id');

      const endpoint = slug ? `/api/payment/link-by-slug/${slug}` : `/api/payment/link/${linkId}`;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();

        document.getElementById('loadingState').classList.add('d-none');

        if (!res.ok || !data.success) {
          const errBox = document.getElementById('errorState');
          errBox.innerText = data.message || "This payment link is invalid, expired, or has been closed.";
          errBox.classList.remove('d-none');
          return;
        }

        const link = data.link || data;

        document.getElementById('paymentTitle').innerText = link.title;
        document.getElementById('paymentAmount').innerText = `${link.currency === 'NGN' ? '₦' : '$'}${Number(link.amount).toLocaleString()} ${link.currency || ''}`;
        document.getElementById('checkoutContent').classList.remove('d-none');

        // Handle payment form submission
        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('clientName').value;
          const email = document.getElementById('clientEmail').value;

          const payBtn = document.getElementById('payBtn');
          payBtn.disabled = true;
          payBtn.innerText = 'Initializing Payment...';

          // Simulate or connect transaction initialization
          alert(`Proceeding to payment for ${link.title} (${link.currency} ${link.amount}) by ${name}`);
          payBtn.disabled = false;
          payBtn.innerText = 'Pay Now';
        });

      } catch (err) {
        console.error("Checkout load error:", err);
        document.getElementById('loadingState').classList.add('d-none');
        const errBox = document.getElementById('errorState');
        errBox.innerText = "Error loading payment link. Please check the URL.";
        errBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
