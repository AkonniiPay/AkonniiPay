<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Secure Guest Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Paystack Inline Popup Script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-lg bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-blue-500 tracking-wider">AkonniiPay</h1>
      <p id="recipientLabel" class="text-xs text-gray-400">Secure Payment Gateway</p>
    </div>

    <!-- Payment Request Summary Card -->
    <div class="bg-gray-800/80 border border-gray-700/60 p-6 rounded-2xl space-y-2">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Payment Request</p>
      <h2 id="checkoutTitle" class="text-xl font-bold text-white">Loading payment details...</h2>
      <p id="checkoutDescription" class="text-xs text-gray-300"></p>
      <div class="pt-2 flex justify-between items-center border-t border-gray-700 mt-4">
        <span class="text-xs text-gray-400">Total Amount</span>
        <span id="checkoutAmount" class="text-3xl font-extrabold text-green-400">$0.00</span>
      </div>
    </div>

    <!-- Payment Form -->
    <form id="checkoutForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Name</label>
        <input type="text" id="guestName" placeholder="Enter your full name" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Email</label>
        <input type="email" id="guestEmail" placeholder="Enter your email address" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Payment Channel</label>
        <select id="paymentMethod" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
          <option value="card">Debit / Credit Card</option>
          <option value="bank_transfer">Bank Transfer / USSD</option>
        </select>
      </div>

      <button type="submit" id="payBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
        Pay Now
      </button>
    </form>

    <div class="text-center">
      <span class="text-xs text-gray-500">🔒 Encrypted & Secured by AkonniiPay</span>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const linkIdentifier = urlParams.get('id') || urlParams.get('slug');

    let linkData = null;

    async function loadCheckoutDetails() {
      if (!linkIdentifier) {
        document.body.innerHTML = `<div class="text-center p-8 text-red-400 font-bold">Invalid or missing payment link URL.</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/payment/checkout/${linkIdentifier}`);
        const data = await res.json();

        if (!res.ok) {
          document.body.innerHTML = `
            <div class="max-w-md mx-auto mt-20 text-center p-8 bg-gray-900 border border-gray-800 rounded-2xl">
              <h2 class="text-2xl font-bold text-red-400">Link Unavailable</h2>
              <p class="text-gray-400 mt-2">${data.message || 'This payment link has expired or does not exist.'}</p>
            </div>
          `;
          return;
        }

        linkData = data;
        document.getElementById('checkoutTitle').innerText = data.title;
        document.getElementById('checkoutDescription').innerText = data.description || '';
        
        const symbol = data.currency === 'NGN' ? '₦' : data.currency === 'EUR' ? '€' : data.currency === 'GBP' ? '£' : '$';
        document.getElementById('checkoutAmount').innerText = `${symbol}${Number(data.amount).toFixed(2)}`;
        document.getElementById('recipientLabel').innerText = `Paid to ${data.recipientName || 'Merchant'}`;

      } catch (err) {
        console.error('Error loading checkout:', err);
      }
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const guestName = document.getElementById('guestName').value;
      const guestEmail = document.getElementById('guestEmail').value;

      if (!linkData) return alert('Payment data not loaded.');

      const amountInSubunits = Math.round(Number(linkData.amount) * 100);
      const reference = 'AKP_PAY_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

      // Your Paystack Test Public Key
      const paystackKey = 'pk_test_f072c4b9ce7cdc851f1c6cad46e84620e66a7252';

      if (typeof PaystackPop !== 'undefined') {
        const handler = PaystackPop.setup({
          key: paystackKey,
          email: guestEmail,
          amount: amountInSubunits,
          currency: linkData.currency || 'USD',
          ref: reference,
          metadata: {
            guestName,
            linkId: linkData.id,
            merchantId: linkData.merchantId
          },
          callback: function(response) {
            verifyPaymentOnBackend(response.reference, guestName, guestEmail);
          },
          onClose: function() {
            alert('Payment window closed.');
          }
        });
        handler.openIframe();
      } else {
        verifyPaymentOnBackend(reference, guestName, guestEmail);
      }
    });

    async function verifyPaymentOnBackend(reference, guestName, guestEmail) {
      try {
        const res = await fetch(`${API_URL}/api/payment/checkout/${linkIdentifier}/pay`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference, guestName, guestEmail, paymentMethod: 'card' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Payment verification failed');

        alert(data.message);
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }

    loadCheckoutDetails();
  </script>
</body>
</html>
