<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Secure Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body.akonnii-loading {
      overflow: hidden !important;
    }

    #akonnii-global-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .akonnii-loader-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .akonnii-progress-track {
      width: 140px;
      height: 3px;
      background-color: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .akonnii-progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #1e40af, #3b82f6, #1e40af);
      position: absolute;
      animation: akonniiSlide 1.2s infinite ease-in-out;
      transform-origin: left;
    }

    @keyframes akonniiSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #akonnii-global-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .checkout-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-part {
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center akonnii-loading" style="min-height: 100vh;">

  <!-- AkonniiPay Global Brand Loader (5-Second Animated SVG Splash) -->
  <div id="akonnii-global-loader">
    <div class="akonnii-loader-body">
      <div style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-part leaf-back">
            <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
          </g>
          <g class="logo-part leaf-front">
            <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
          </g>
          <g class="logo-part blue-body">
            <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
          </g>
          <g class="logo-part card-element">
            <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
            <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
            <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
            <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
          </g>
        </svg>
      </div>
      <div class="akonnii-progress-track">
        <div class="akonnii-progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-lg p-4 rounded-4 w-100" style="max-width: 480px;">
    <div class="text-center mb-4">
      <div class="checkout-logo">
        <svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-part">
            <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
            <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
            <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
            <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
            <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
            <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
            <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
          </g>
        </svg>
      </div>
      <h3 class="fw-bold text-primary mb-0">AkonniiPay</h3>
      <p class="text-muted small">Secure Client Checkout</p>
    </div>

    <div id="loadingState" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted small mt-2">Loading payment details...</p>
    </div>

    <div id="successState" class="alert alert-success d-none text-center py-4">
      <i class="bi bi-check-circle-fill fs-1 text-success mb-2"></i>
      <h4 class="fw-bold text-success">Payment Successful!</h4>
      <p class="text-muted small mb-0">Thank you! Your payment has been processed successfully.</p>
    </div>

    <div id="errorState" class="alert alert-danger d-none text-center py-3"></div>

    <div id="checkoutContent" class="d-none">
      <div class="bg-light p-3 rounded-3 mb-3 border">
        <span class="text-muted small fw-semibold d-block mb-1">Payment For</span>
        <h5 class="fw-bold text-dark mb-2" id="paymentTitle">Loading...</h5>
        
        <div class="d-flex justify-content-between align-items-center text-muted small mb-1">
          <span>Base Amount</span>
          <span id="baseAmountText">₦0</span>
        </div>
        <div id="feeRow" class="d-flex justify-content-between align-items-center text-muted small mb-2 d-none">
          <span>Processing Fee (Payer)</span>
          <span id="feeAmountText">₦0</span>
        </div>
        <div class="d-flex justify-content-between align-items-center border-top pt-2">
          <span class="fw-semibold text-dark">Total Due</span>
          <h4 class="fw-bold text-success mb-0" id="paymentAmount">₦0</h4>
        </div>
      </div>

      <form id="checkoutForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Your Full Name</label>
          <input type="text" id="clientName" class="form-control" placeholder="Enter your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Your Email Address</label>
          <input type="email" id="clientEmail" class="form-control" placeholder="Enter your email" required>
        </div>

        <button type="submit" id="payBtn" class="btn btn-primary w-100 fw-semibold py-2">
          Pay Now
        </button>
      </form>
    </div>

    <div class="text-center mt-4">
      <small class="text-muted"><i class="bi bi-shield-lock-fill text-success me-1"></i> Secured by AkonniiPay Direct Gateway</small>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const loader = document.getElementById('akonnii-global-loader');
      setTimeout(function() {
        if (loader) {
          loader.classList.add('hidden');
          document.body.classList.remove('akonnii-loading');
        }
      }, 5000); // 5-Second Duration
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('status') === 'success') {
        const linkId = urlParams.get('linkId');
        if (linkId) {
          try {
            await fetch('/api/payment/verify-and-credit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ linkId })
            });
          } catch (e) {
            console.error("Auto credit error:", e);
          }
        }

        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('successState').classList.remove('d-none');
        return;
      }

      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const payIndex = pathParts.indexOf('pay');
      const slug = payIndex !== -1 ? pathParts[payIndex + 1] : null;
      const linkId = urlParams.get('id');

      let endpoint = '';
      if (slug) {
        endpoint = `/api/payment/link-by-slug/${slug}`;
      } else if (linkId) {
        endpoint = `/api/payment/link/${linkId}`;
      } else {
        document.getElementById('loadingState').classList.add('d-none');
        const errBox = document.getElementById('errorState');
        errBox.innerText = "Invalid payment link URL.";
        errBox.classList.remove('d-none');
        return;
      }

      try {
        const res = await fetch(endpoint);
        const data = await res.json();

        document.getElementById('loadingState').classList.add('d-none');

        if (!res.ok || !data.success) {
          const errBox = document.getElementById('errorState');
          errBox.innerText = data.message || "This payment link is invalid, expired, or has been closed.";
          errBox.classList.remove('d-none');
          return;
        }

        const link = data.link || data;

        let baseAmount = Number(link.amount);
        let finalAmount = baseAmount;
        let fee = 0;
        const currSymbol = link.currency === 'NGN' ? '₦' : (link.currency === 'GBP' ? '£' : (link.currency === 'EUR' ? '€' : '$'));

        if (link.feeBearer === 'payer' || link.chargeBearer === 'payer') {
          fee = link.currency === 'NGN' ? Math.min((baseAmount * 0.015) + 10, 2000) : baseAmount * 0.029;
          finalAmount = baseAmount + fee;

          document.getElementById('baseAmountText').innerText = `${currSymbol}${baseAmount.toLocaleString()}`;
          document.getElementById('feeAmountText').innerText = `${currSymbol}${fee.toFixed(2)}`;
          document.getElementById('feeRow').classList.remove('d-none');
        } else {
          document.getElementById('baseAmountText').innerText = `${currSymbol}${baseAmount.toLocaleString()}`;
        }

        document.getElementById('paymentTitle').innerText = link.title;
        document.getElementById('paymentAmount').innerText = `${currSymbol}${Math.round(finalAmount).toLocaleString()} ${link.currency || ''}`;
        document.getElementById('checkoutContent').classList.remove('d-none');

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('clientName').value;
          const email = document.getElementById('clientEmail').value;

          const payBtn = document.getElementById('payBtn');
          payBtn.disabled = true;
          payBtn.innerText = 'Redirecting to Secure Gateway...';

          try {
            const initRes = await fetch('/api/payment/initialize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                linkId: link._id,
                slug: link.slug,
                email: email,
                name: name,
                amount: finalAmount,
                currency: link.currency
              })
            });

            const initData = await initRes.json();

            if (initRes.ok && initData.success && initData.authorization_url) {
              window.location.href = initData.authorization_url;
            } else {
              alert(initData.message || "Error initiating payment gateway.");
              payBtn.disabled = false;
              payBtn.innerText = 'Pay Now';
            }
          } catch (err) {
            console.error("Payment init error:", err);
            alert("Server error connecting to payment gateway.");
            payBtn.disabled = false;
            payBtn.innerText = 'Pay Now';
          }
        });

      } catch (err) {
        console.error("Checkout load error:", err);
        document.getElementById('loadingState').classList.add('d-none');
        const errBox = document.getElementById('errorState');
        errBox.innerText = "Error loading payment link. Please check the URL.";
        errBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
