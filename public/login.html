<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkonniiPay - Merchant Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .form-control {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #1f2937;
            border-color: #4318ff;
            color: #fff;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        a {
            color: #818cf8;
            text-decoration: none;
        }
        a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-white">AkonniiPay</h3>
        <p class="text-muted small">Sign in to your merchant dashboard</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label small fw-bold">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
    </form>

    <div class="text-center text-muted small">
        Don't have an account? <a href="/signup">Sign up</a>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
