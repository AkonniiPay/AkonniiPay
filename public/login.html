<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-500">AkonniiPay</h1>
      <p class="text-gray-400 text-sm mt-1">Sign in to your merchant dashboard</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 text-sm rounded-lg"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@example.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg shadow-lg transition">Sign In</button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Don't have an account? <a href="/signup.html" class="text-blue-400 hover:underline">Sign Up</a>
    </p>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
