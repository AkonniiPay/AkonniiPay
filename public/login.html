<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-part {
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card border-0 shadow-lg p-4 rounded-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <div class="auth-logo">
        <svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-part">
            <path d="M 230 135 C 230 80, 275 50, 315 50 C 315 105, 270 135, 230 135 Z" fill="#00b33c" />
            <path d="M 225 155 C 225 100, 280 75, 318 85 C 318 140, 260 165, 225 155 Z" fill="#00cc44" />
            <path d="M 175 295 C 135 295, 140 200, 195 120 C 235 120, 260 210, 245 270 C 230 300, 195 295, 175 295 Z" fill="#1a52de" />
            <rect x="200" y="195" width="135" height="92" rx="18" fill="#ffffff" />
            <rect x="206" y="201" width="123" height="80" rx="14" fill="#0073e6" />
            <rect x="212" y="215" width="111" height="12" rx="3" fill="#ffffff" />
            <rect x="290" y="250" width="20" height="15" rx="3" fill="#ffffff" />
          </g>
        </svg>
      </div>
      <h2 class="fw-bold text-primary mb-0">AkonniiPay</h2>
      <p class="text-muted small">Sign in to manage your account and balances</p>
    </div>

    <div id="alertBox" class="alert d-none py-2 px-3 small" role="alert"></div>

    <form id="loginForm" onsubmit="return false;">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Don't have an account? <a href="/signup.html" class="text-decoration-none">Sign Up</a></small>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
