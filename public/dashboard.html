<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkonniiPay - Merchant Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-bold text-blue-500">AkonniiPay</div>
    <div class="flex items-center gap-4">
      <span id="userInfo" class="text-sm text-gray-300">Loading user...</span>
      <button id="logoutBtn" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition">Logout</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">

    <!-- Wallet Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Available Balance</p>
        <h2 id="walletBalance" class="text-3xl font-extrabold text-green-400 mt-2">$0.00</h2>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Received</p>
        <h2 id="totalReceived" class="text-3xl font-extrabold text-blue-400 mt-2">$0.00</h2>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Payment Links</p>
        <h2 id="linkCount" class="text-3xl font-extrabold text-purple-400 mt-2">0</h2>
      </div>
    </div>

    <!-- Payment Link Generator -->
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-xl">
      <h3 class="text-lg font-bold mb-4">Create Payment Link</h3>
      <form id="createLinkForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" id="linkTitle" placeholder="Service or Product Description" required class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
        <input type="number" id="linkAmount" placeholder="Amount ($)" step="0.01" required class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 rounded-lg shadow-lg transition">Generate Link</button>
      </form>
      
      <!-- Generated Link Result -->
      <div id="generatedLinkBox" class="hidden mt-4 p-4 bg-gray-800 rounded-lg border border-gray-700 flex items-center justify-between">
        <span id="generatedUrl" class="text-sm font-mono text-blue-300 truncate mr-2"></span>
        <button id="copyBtn" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded transition">Copy Link</button>
      </div>
    </div>

  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
